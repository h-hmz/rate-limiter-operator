# This lives in a patch because config/webhook/manifests.yaml is regenerated by `make manifests`.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
  - name: mpod-v1.kb.io
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - rate-limiter-operator-system
            - kube-system
            - cert-manager
    # Evaluated by the API server, to gate on an annotation without invoking the webhook for every pod in the cluster.
    matchConditions:
      - name: injection-enabled
        expression: >-
          has(object.metadata.annotations) &&
          'rl.hhmz.dev/inject' in object.metadata.annotations &&
          object.metadata.annotations['rl.hhmz.dev/inject'] == 'true'
