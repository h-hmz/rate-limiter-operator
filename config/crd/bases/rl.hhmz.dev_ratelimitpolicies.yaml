    kind: RateLimitPolicy
    listKind: RateLimitPolicyList
    plural: ratelimitpolicies
    shortNames:
    - rlp
    singular: ratelimitpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.algorithm
      name: Algorithm
      type: string
    - jsonPath: .spec.store
      name: Store
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
